# ═══════════════════════════════════════════════════════════
# 青囊 APP · 生产部署 Nginx 配置
# 路径: /etc/nginx/conf.d/qingnang.conf
# 使用: sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name yourdomain.com;   # TODO: 换成你的域名

    # ── 前端静态资源（Vite build 产物） ──
    root /var/www/qingnang/dist;
    index index.html;

    # 强制 HTTPS（Let's Encrypt 证书申请后注释掉）
    # return 301 https://$host$request_uri;

    # ── Vue Router history 模式回退 ──
    # 所有非文件请求走 index.html（前端路由接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 API 反代 ──
    # VITE_API_BASE 留空时，前端相对路径 /api/xxx → 这里转给 FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接（AI 流式对话）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ── FastAPI docs 也可外网访问（可选） ──
    location /docs { proxy_pass http://127.0.0.1:8767/docs; }
    location /redoc { proxy_pass http://127.0.0.1:8767/redoc; }
    location /openapi.json { proxy_pass http://127.0.0.1:8767/openapi.json; }
    location /health { proxy_pass http://127.0.0.1:8767/health; }

    # ── 静态资源缓存（Vite 产物有 hash，可长缓存） ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 安全响应头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

